<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Forum</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1><button class="home-button" type="button" data-home-feed>Real-Time Forum</button></h1>

    <nav aria-label="Main navigation">
      <button type="button" data-view="login" data-guest-only>Login</button>
      <button type="button" data-view="register" data-guest-only>Register</button>
      <button type="button" data-view="feed" data-auth-required hidden>Feed</button>
      <button type="button" data-view="create-post" data-auth-required hidden>Create Post</button>
      <button type="button" data-view="profile" data-profile-owner data-auth-required hidden>My Profile</button>
      <button type="button" data-logout hidden>Logout</button>
    </nav>
  </header>

  <p id="auth-status" class="auth-status" role="status" aria-live="polite" hidden></p>
  <p id="realtime-status" role="status" aria-live="polite" hidden></p>
  <button id="realtime-retry" type="button" hidden>Retry live connection</button>

  <div class="layout">
    <main>
      <section data-view-panel="login">
        <h2>Login</h2>
        <form id="login-form" class="login-form" method="post" action="/login" novalidate>
          <div class="field">
            <label for="login-identifier">Nickname or email</label>
            <input
              id="login-identifier"
              name="identifier"
              type="text"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit">Login</button>
          <p id="login-result" data-login-result role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section data-view-panel="register" hidden>
        <h2>Register</h2>
        <form
          id="registration-form"
          class="registration-form"
          method="post"
          action="/register"
          novalidate
        >
          <div class="field">
            <label for="register-username">Nickname</label>
            <input
              id="register-username"
              name="username"
              type="text"
              minlength="3"
              maxlength="32"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="register-age">Age</label>
            <input
              id="register-age"
              name="age"
              type="number"
              min="1"
              max="120"
              step="1"
              required
            >
          </div>

          <div class="field">
            <label for="register-gender">Gender</label>
            <input id="register-gender" name="gender" type="text" required>
          </div>

          <div class="field">
            <label for="register-first-name">First name</label>
            <input
              id="register-first-name"
              name="first_name"
              type="text"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="field">
            <label for="register-last-name">Last name</label>
            <input
              id="register-last-name"
              name="last_name"
              type="text"
              autocomplete="family-name"
              required
            >
          </div>

          <div class="field">
            <label for="register-email">Email</label>
            <input
              id="register-email"
              name="email"
              type="email"
              maxlength="254"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              required
            >
          </div>

          <button type="submit">Create account</button>
          <p
            id="registration-result"
            data-registration-result
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </form>
      </section>

      <section data-view-panel="feed" hidden>
        <h2>Feed</h2>
        <p id="feed-status" class="feed-status" role="status" aria-live="polite" hidden></p>
        <div id="feed-posts" class="post-feed" aria-live="polite"></div>
      </section>

      <section data-view-panel="create-post" hidden>
        <h2>Create a post</h2>
        <form id="post-form" class="post-form" method="post" action="/api/posts" novalidate>
          <div class="field">
            <label for="post-title">Title</label>
            <input id="post-title" name="title" type="text" maxlength="120" required>
          </div>

          <div class="field">
            <label for="post-body">Post</label>
            <textarea id="post-body" name="body" maxlength="5000" rows="8" required></textarea>
          </div>

          <fieldset class="category-picker">
            <legend>Categories</legend>
            <div id="post-categories" data-category-list aria-live="polite">Sign in to load categories.</div>
          </fieldset>

          <button type="submit" disabled>Create post</button>
          <p id="post-result" data-post-result role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section data-view-panel="post" hidden>
        <h2 id="detail-title">Post detail</h2>
        <p id="detail-status" role="status" aria-live="polite" hidden></p>
        <article id="post-detail"></article>
        <section aria-labelledby="comments-title">
          <h3 id="comments-title">Comments</h3>
          <p id="comments-status" role="status" aria-live="polite" hidden></p>
          <div id="post-comments"></div>
          <form id="comment-form" action="/api/posts/0/comments" method="post" hidden>
            <label for="comment-body">Add a comment</label>
            <textarea id="comment-body" name="body" rows="4" maxlength="2000" required></textarea>
            <button type="submit">Add comment</button>
            <p id="comment-result" role="status" aria-live="polite" hidden></p>
          </form>
        </section>
        <button type="button" data-view="feed">Back to feed</button>
      </section>

      <div id="chat-windows" class="chat-windows" aria-label="Open conversations"></div>
      <template id="chat-window-template">
      <section class="chat-widget" aria-label="Private conversation">
        <div class="conversation-header">
          <span class="conversation-avatar" aria-hidden="true">?</span>
          <div>
            <h2 data-chat-title>Chat</h2>
            <p>Private conversation</p>
          </div>
          <button data-chat-minimize class="chat-minimize" type="button" aria-label="Minimize chat">−</button>
          <button data-chat-close class="chat-close" type="button" aria-label="Close chat">×</button>
        </div>
        <p data-chat-status role="status" aria-live="polite">Loading messages…</p>
        <button data-history-retry type="button" hidden>Retry loading messages</button>
        <div data-chat-history class="chat-history" role="log" aria-live="polite" tabindex="0"></div>
        <form data-message-form class="message-form">
          <label for="message-body">Message</label>
          <textarea data-message-body name="body" rows="2" maxlength="2000" placeholder="Write a message…"></textarea>
          <label class="message-image-label">Optional image (JPEG, PNG, or GIF; max 5 MiB)</label>
          <input name="image" type="file" accept="image/jpeg,image/png,image/gif">
          <button type="submit">Send message</button>
          <p data-message-status role="status" aria-live="polite"></p>
        </form>
      </section>
      </template>

      <section data-view-panel="profile" hidden>
        <h2 id="profile-title">Profile</h2>
        <p id="profile-status" role="status" aria-live="polite"></p>
        <dl id="profile-details" class="profile-details"></dl>
        <form id="profile-form" class="profile-form" hidden>
          <h3>Edit your profile</h3>
          <p>These changes apply only to your profile.</p>
          <label for="profile-first-name">First name</label>
          <input id="profile-first-name" name="first_name" maxlength="80" required>
          <label for="profile-last-name">Last name</label>
          <input id="profile-last-name" name="last_name" maxlength="80" required>
          <label for="profile-age">Age</label>
          <input id="profile-age" name="age" type="number" min="1" max="120" required>
          <label for="profile-gender">Gender</label>
          <input id="profile-gender" name="gender" maxlength="40" required>
          <button type="submit">Save profile</button>
        </form>
        <button type="button" data-view="feed">Back to feed</button>
      </section>
    </main>

    <aside aria-label="Chat contacts">
      <h2>Contacts</h2>
      <p id="contact-status" role="status" aria-live="polite">Sign in to see your contacts.</p>
      <ul id="contact-list" class="contact-list" aria-live="polite"></ul>
    </aside>
  </div>
  <button id="chat-launcher" class="chat-launcher" type="button" data-chat-toggle data-auth-required hidden aria-label="Open messages"><span class="chat-launcher-icon" aria-hidden="true"></span><span>Messages</span></button>
</body>
</html>
