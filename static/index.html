<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Forum</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Real-Time Forum</h1>

    <nav aria-label="Main navigation">
      <button type="button" data-view="login">Login</button>
      <button type="button" data-view="register">Register</button>
      <button type="button" data-view="feed">Feed</button>
      <button type="button" data-view="post">Post detail</button>
      <button type="button" data-view="chat">Chat</button>
    </nav>
  </header>

  <div class="layout">
    <main>
      <section data-view-panel="login">
        <h2>Login</h2>
        <p>Login form will be added in a later phase.</p>
      </section>

      <section data-view-panel="register" hidden>
        <h2>Register</h2>
        <form
          id="registration-form"
          class="registration-form"
          method="post"
          action="/register"
          novalidate
        >
          <div class="field">
            <label for="register-username">Nickname</label>
            <input
              id="register-username"
              name="username"
              type="text"
              minlength="3"
              maxlength="32"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="register-age">Age</label>
            <input
              id="register-age"
              name="age"
              type="number"
              min="1"
              max="120"
              step="1"
              required
            >
          </div>

          <div class="field">
            <label for="register-gender">Gender</label>
            <input id="register-gender" name="gender" type="text" required>
          </div>

          <div class="field">
            <label for="register-first-name">First name</label>
            <input
              id="register-first-name"
              name="first_name"
              type="text"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="field">
            <label for="register-last-name">Last name</label>
            <input
              id="register-last-name"
              name="last_name"
              type="text"
              autocomplete="family-name"
              required
            >
          </div>

          <div class="field">
            <label for="register-email">Email</label>
            <input
              id="register-email"
              name="email"
              type="email"
              maxlength="254"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              required
            >
          </div>

          <button type="submit">Create account</button>
          <p
            id="registration-result"
            data-registration-result
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </form>
      </section>

      <section data-view-panel="feed" hidden>
        <h2>Feed</h2>
        <p>Posts will appear here.</p>
      </section>

      <section data-view-panel="post" hidden>
        <h2>Post detail</h2>
        <p>The selected post and its comments will appear here.</p>
      </section>

      <section data-view-panel="chat" hidden>
        <h2>Chat</h2>
        <p>The selected conversation will appear here.</p>
      </section>
    </main>

    <aside aria-label="Chat contacts">
      <h2>Contacts</h2>
      <p>Online and offline users will appear here.</p>
    </aside>
  </div>
</body>
</html>
