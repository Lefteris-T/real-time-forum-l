<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Forum</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Real-Time Forum</h1>

    <nav aria-label="Main navigation">
      <button type="button" data-view="login" data-guest-only>Login</button>
      <button type="button" data-view="register" data-guest-only>Register</button>
      <button type="button" data-view="feed" data-auth-required hidden>Feed</button>
      <button type="button" data-view="create-post" data-auth-required hidden>Create Post</button>
      <button type="button" data-view="chat" data-auth-required hidden>Chat</button>
      <button type="button" data-logout hidden>Logout</button>
    </nav>
  </header>

  <p id="auth-status" class="auth-status" role="status" aria-live="polite" hidden></p>
  <p id="realtime-status" role="status" aria-live="polite" hidden></p>
  <button id="realtime-retry" type="button" hidden>Retry live connection</button>

  <div class="layout">
    <main>
      <section data-view-panel="login">
        <h2>Login</h2>
        <form id="login-form" class="login-form" method="post" action="/login" novalidate>
          <div class="field">
            <label for="login-identifier">Nickname or email</label>
            <input
              id="login-identifier"
              name="identifier"
              type="text"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit">Login</button>
          <p id="login-result" data-login-result role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section data-view-panel="register" hidden>
        <h2>Register</h2>
        <form
          id="registration-form"
          class="registration-form"
          method="post"
          action="/register"
          novalidate
        >
          <div class="field">
            <label for="register-username">Nickname</label>
            <input
              id="register-username"
              name="username"
              type="text"
              minlength="3"
              maxlength="32"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="register-age">Age</label>
            <input
              id="register-age"
              name="age"
              type="number"
              min="1"
              max="120"
              step="1"
              required
            >
          </div>

          <div class="field">
            <label for="register-gender">Gender</label>
            <input id="register-gender" name="gender" type="text" required>
          </div>

          <div class="field">
            <label for="register-first-name">First name</label>
            <input
              id="register-first-name"
              name="first_name"
              type="text"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="field">
            <label for="register-last-name">Last name</label>
            <input
              id="register-last-name"
              name="last_name"
              type="text"
              autocomplete="family-name"
              required
            >
          </div>

          <div class="field">
            <label for="register-email">Email</label>
            <input
              id="register-email"
              name="email"
              type="email"
              maxlength="254"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              required
            >
          </div>

          <button type="submit">Create account</button>
          <p
            id="registration-result"
            data-registration-result
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </form>
      </section>

      <section data-view-panel="feed" hidden>
        <h2>Feed</h2>
        <p id="feed-status" class="feed-status" role="status" aria-live="polite" hidden></p>
        <div id="feed-posts" class="post-feed" aria-live="polite"></div>
      </section>

      <section data-view-panel="create-post" hidden>
        <h2>Create a post</h2>
        <form id="post-form" class="post-form" method="post" action="/api/posts" novalidate>
          <div class="field">
            <label for="post-title">Title</label>
            <input id="post-title" name="title" type="text" maxlength="120" required>
          </div>

          <div class="field">
            <label for="post-body">Post</label>
            <textarea id="post-body" name="body" maxlength="5000" rows="8" required></textarea>
          </div>

          <fieldset class="category-picker">
            <legend>Categories</legend>
            <div id="post-categories" data-category-list aria-live="polite">Sign in to load categories.</div>
          </fieldset>

          <button type="submit" disabled>Create post</button>
          <p id="post-result" data-post-result role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section data-view-panel="post" hidden>
        <h2 id="detail-title">Post detail</h2>
        <p id="detail-status" role="status" aria-live="polite" hidden></p>
        <article id="post-detail"></article>
        <section aria-labelledby="comments-title">
          <h3 id="comments-title">Comments</h3>
          <p id="comments-status" role="status" aria-live="polite" hidden></p>
          <div id="post-comments"></div>
          <form id="comment-form" action="/api/posts/0/comments" method="post" hidden>
            <label for="comment-body">Add a comment</label>
            <textarea id="comment-body" name="body" rows="4" maxlength="2000" required></textarea>
            <button type="submit">Add comment</button>
            <p id="comment-result" role="status" aria-live="polite" hidden></p>
          </form>
        </section>
        <button type="button" data-view="feed">Back to feed</button>
      </section>

      <section data-view-panel="chat" hidden>
        <h2 id="chat-title">Chat</h2>
        <p id="chat-status" role="status" aria-live="polite">Choose a contact to view messages.</p>
        <button id="history-retry" type="button" hidden>Retry loading messages</button>
        <div id="chat-history" class="chat-history" role="log" aria-live="polite" tabindex="0"></div>
      </section>
    </main>

    <aside aria-label="Chat contacts">
      <h2>Contacts</h2>
      <p id="contact-status" role="status" aria-live="polite">Sign in to see your contacts.</p>
      <ul id="contact-list" class="contact-list" aria-live="polite"></ul>
    </aside>
  </div>
</body>
</html>
