services:
  forum:
    build: .
    container_name: forum

    group_add:
      - "${FORUM_CERT_GID}"

    ports:
      - "8443:8443"

    environment:
      FORUM_ADDRESS: ":8443"
      FORUM_DATABASE_PATH: "/app/data/realtime-forum.db"
      FORUM_ENV: "production"
      FORUM_SESSION_DURATION: "24h"
      FORUM_COOKIE_NAME: "__Host-forum_session"
      FORUM_HTTPS_ENABLED: "true"
      FORUM_TLS_CERT_FILE: "/run/certs/localhost.crt"
      FORUM_TLS_KEY_FILE: "/run/certs/localhost.key"
      FORUM_SECURE_COOKIE: "true"


    volumes:
      - forum-data:/app/data
      - ./certs:/run/certs:ro

    restart: unless-stopped

volumes:
  forum-data:
    name: forum-data
