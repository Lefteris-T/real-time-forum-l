<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Join — Common Ground</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
        <a class="brand" href="/" aria-label="Common Ground home"><span class="brand-mark" aria-hidden="true">✦</span><span>Common Ground</span></a>
        <a class="nav-link" href="/login">Log in</a>
    </nav>
</header>

<main class="page-shell">

    <section
        class="form-card compact"
        aria-labelledby="register-title"
    >

        <h1 id="register-title">
            Join the conversation.
        </h1>

        <p>
            Make a space for your questions, ideas, and discoveries.
        </p>

        {{if .Error}}
            <p role="alert">
                {{.Error}}
            </p>
        {{end}}

        <form method="post" action="/register" novalidate>

            <div class="field">
                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    value="{{.Email}}"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="username">
                    Nickname
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    value="{{.Username}}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="age">Age</label>
                <input id="age" name="age" type="number" min="1" max="120" required>
            </div>

            <div class="field">
                <label for="gender">Gender</label>
                <input id="gender" name="gender" type="text" required>
            </div>

            <div class="field">
                <label for="first_name">First name</label>
                <input id="first_name" name="first_name" type="text" autocomplete="given-name" required>
            </div>

            <div class="field">
                <label for="last_name">Last name</label>
                <input id="last_name" name="last_name" type="text" autocomplete="family-name" required>
            </div>

            <div class="field">
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit">
                Create account
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">
                <strong>Log in</strong>
            </a>
        </p>

    </section>

</main>

</body>
</html>
